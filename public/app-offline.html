<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0A857D" />
    <title>GenPlus Aircond · Offline</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #071d1b; color: #fff; font-family: Arial, sans-serif; }
      main { width: min(100%, 420px); padding: 28px; border: 1px solid rgba(255,255,255,.12); border-radius: 20px; background: #0b302c; box-shadow: 0 24px 70px rgba(0,0,0,.3); }
      i { display: block; width: 14px; height: 14px; margin-bottom: 22px; border-radius: 50%; background: #b8fff7; box-shadow: 0 0 0 8px rgba(184,255,247,.09); }
      h1 { margin: 0; font-size: 26px; }
      p { margin: 12px 0 0; color: #c9dedb; font-size: 15px; line-height: 1.6; }
      button { width: 100%; margin-top: 24px; padding: 13px 16px; border: 0; border-radius: 10px; color: #063f3b; background: #b8fff7; font: inherit; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <i aria-hidden="true"></i>
      <h1>GenPlus is offline</h1>
      <p>This device has not downloaded the application workspace yet. Connect once, sign in and open Team Tasks to prepare it for offline use.</p>
      <button type="button" onclick="location.reload()">Try connection again</button>
    </main>
  </body>
</html>
